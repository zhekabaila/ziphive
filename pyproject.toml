[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcomp"
version = "0.01.0"
description = "ZipHive - distributed data compression with Master-Worker architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-timeout>=2",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=60"
pythonpath = ["src"]
markers = [
    "integration: test yang menjalankan proses nyata di localhost",
    "perf: perbandingan waktu, informatif saja",
    "slow: skenario 9 Worker lokal",
]
